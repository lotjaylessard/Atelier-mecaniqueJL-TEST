name: S10 garde-fou configuration production
on:
  push:
    branches: [integration-finale]
    paths:
      - audit/s10-check-production-bundle.cjs
      - audit/test-s10-production-bundle.cjs
      - audit/s10-inventory-runtime-dependencies.cjs
      - audit/s10-assemble-isolated-rollback.cjs
      - audit/test-s10-assemble-isolated-rollback.cjs
      - audit/s10-test-*-snapshot.json
      - audit/s10-schema-draft-NO-GO.sql
      - audit/s10-compare-cloud-snapshots.cjs
      - audit/s10-cloud-reference/**
      - audit/s10-check-edge-functions.cjs
      - audit/test-s10-edge-functions.cjs
      - audit/test-s10-edge-prod-readiness.cjs
      - audit/test-s10-calendar-prod-contract.cjs
      - audit/S10-CALENDRIERS-PROD-DEPLOIEMENT.md
      - audit/edge-candidate/**
      - audit/s10-build-production-candidate.cjs
      - audit/test-s10-build-production-candidate.cjs
      - audit/test-s10-real-source-bundle.cjs
      - index.html
      - login.html
      - audit/s06-live-test.js
      - audit/s06-wo-pilot.js
      - audit/s06-sidebar-persistent.js
      - audit/s10-check-storage-compat.cjs
      - audit/test-s10-storage-compat.cjs
      - audit/test-s10-storage-tenant-policy.cjs
      - audit/s10-prod-legacy-physical-backup-browser.js
      - audit/test-s10-prod-legacy-physical-backup.cjs
      - audit/s10-export-prod-physical-files.ps1
      - audit/test-s10-export-prod-physical-files.ps1
      - audit/s10-storage-tenant-isolation-candidate-NOT-EXECUTED.sql
      - audit/s10-local-restore-business-integrity-READ-ONLY.psql
      - audit/s10-verify-local-restore-vs-checkpoint.ps1
      - audit/test-s10-restore-checkpoint.cjs
      - audit/s10-local-post-phase-1-to-4-integrity-READ-ONLY.psql
      - audit/s10-ci-synthetic-prod-restore-fixture.sql
      - audit/s10-ci-supabase-runtime-stubs.sql
      - audit/s10-ci-garage-data-rls-isolation.sql
      - audit/s10-ci-garage-write-rls-rollback.sql
      - audit/s10-ci-timer-invoice-auth-rollback.sql
      - audit/s10-plan-friend-storage-remap.cjs
      - audit/test-s10-plan-friend-storage-remap.cjs
      - audit/s10-plan-two-garage-merge.cjs
      - audit/test-s10-plan-two-garage-merge.cjs
      - audit/s10-ci-storage-legacy-fixture.sql
      - audit/s10-ci-storage-rls-isolation.sql
      - audit/s10-ci-storage-public-reset.sql
      - audit/s10-build-atomic-storage-cutover.cjs
      - audit/s10-prod-complete-migration-candidate-NOT-EXECUTED.sql
      - audit/s10-local-restore-apply-phases-1-to-4.psql
      - audit/s10-generate-local-phase5-to-10.cjs
      - audit/s10-local-clone-supabase-shims.sql
      - audit/s10-ci-three-legacy-policies.sql
      - audit/s10-run-existing-local-restore-continuation.ps1
      - audit/s10-phase1-local-additive-garage-data.sql
      - audit/s10-phase2-local-garage-members.sql
      - audit/s10-phase3-local-operational-tables.sql
      - audit/s10-phase4-local-external-calendars.sql
      - audit/test-s10-local-post-phase-integrity.cjs
      - .github/workflows/s10-production-bundle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester remappage privé des 19 fichiers du second garage (données fictives)
        run: node audit/test-s10-plan-friend-storage-remap.cjs
      - name: Tester la fusion métier isolée des deux garages sans écriture (fictif)
        run: node audit/test-s10-plan-two-garage-merge.cjs
      - name: Tests du contrôle de déploiement
        run: node audit/test-s10-production-bundle.cjs
      - name: Vérifier que la branche TEST est refusée comme paquet PROD
        run: |
          if node audit/s10-check-production-bundle.cjs .; then
            echo "ERREUR: le code TEST a été accepté comme paquet PROD"
            exit 1
          else
            echo "OK: la configuration TEST est refusée en production"
          fi

      - name: Inventaire des références TEST dans les fichiers applicatifs
        run: node audit/s10-inventory-runtime-dependencies.cjs .
      - name: Tester les garde-fous de stockage PROD
        run: node audit/test-s10-storage-compat.cjs
      - name: Vérifier que l'isolation localStorage TEST bloque PROD
        run: |
          if node audit/s10-check-storage-compat.cjs .; then
            echo "ERREUR: isolation TEST acceptée pour PROD"
            exit 1
          else
            echo "OK: le stockage TEST bloque le déploiement PROD"
          fi
      - name: Vérifier syntaxe PowerShell export réel sans exécuter ni télécharger
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'audit/s10-export-prod-physical-files.ps1'),
            [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host 'S10_POWERSHELL_EXPORT_PARSE_OK'
      - name: Verifier syntaxe du lancement sur restauration locale existante
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'audit/s10-run-existing-local-restore-continuation.ps1'),
            [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host 'S10_EXISTING_LOCAL_RESTORE_PS_PARSE_OK'
      - name: Exécuter réellement PowerShell sur 55 fichiers fictifs sans réseau
        shell: pwsh
        run: ./audit/test-s10-export-prod-physical-files.ps1
      - name: Tester sauvegarde physique ancienne PROD dans un navigateur simulé (sans données réelles)
        run: node audit/test-s10-prod-legacy-physical-backup.cjs
      - name: Vérifier l'isolation du stockage privé et les liens signés
        run: node audit/test-s10-storage-tenant-policy.cjs
      - name: Verifier le garde-fou de controle de restauration locale
        run: node audit/test-s10-restore-checkpoint.cjs
      - name: Verifier les invariants de la simulation locale des phases 1-4
        run: node audit/test-s10-local-post-phase-integrity.cjs
      - name: Tester la génération isolée d'un candidat PROD
        run: node audit/test-s10-build-production-candidate.cjs
      - name: Assembler et verifier le vrai site web PROD temporaire (NO-GO)
        run: node audit/test-s10-real-source-bundle.cjs
      - name: Vérifier contrat navigateur, OAuth et calendrier PROD
        run: node audit/test-s10-calendar-prod-contract.cjs
      - name: Valider les quatre candidats Edge PROD sans secret ni URL TEST
        run: node audit/test-s10-edge-prod-readiness.cjs
      - name: Tester l'inventaire des Edge Functions
        run: node audit/test-s10-edge-functions.cjs
      - name: Signaler les Edge Functions non versionnées sans casser les tests existants
        run: |
          node audit/s10-check-edge-functions.cjs . > edge-functions-report.json || true
          cat edge-functions-report.json
      - name: Rapporter dérive des sources Google et FamilyWall
        run: node audit/s10-compare-cloud-snapshots.cjs .
      - name: Tester assemblage SQL avec ROLLBACK obligatoire
        run: node audit/test-s10-assemble-isolated-rollback.cjs

  isolated-postgres-rehearsal:
    name: S10 PostgreSQL 17 — phases 1-4 sur données fictives
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: s10_fake_ci_password_only
          POSTGRES_DB: atelier_jl_restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atelier_jl_restore_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: atelier_jl_restore_test
      PGPASSWORD: s10_fake_ci_password_only
    steps:
      - uses: actions/checkout@v4
      - name: Créer une copie SYNTHÉTIQUE de l'ancienne PROD
        run: docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -f - < audit/s10-ci-synthetic-prod-restore-fixture.sql
      - name: Capturer l'empreinte exacte du JSON métier avant la migration
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -Atc "SELECT md5(data::text) FROM public.garage_data;" > /tmp/s10-before-business-data.md5
          test "$(wc -l < /tmp/s10-before-business-data.md5)" -eq 1
      - name: Exécuter réellement les phases 1 à 4 sur le PostgreSQL jetable
        shell: bash
        run: |
          set -euo pipefail
          docker exec ${{ job.services.postgres.id }} mkdir -p /tmp/s10-audit
          for file in s10-local-restore-apply-phases-1-to-4.psql s10-phase1-local-additive-garage-data.sql s10-phase2-local-garage-members.sql s10-phase3-local-operational-tables.sql s10-phase4-local-external-calendars.sql; do
            docker cp "audit/$file" ${{ job.services.postgres.id }}:/tmp/s10-audit/"$file"
          done
          docker exec ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -f /tmp/s10-audit/s10-local-restore-apply-phases-1-to-4.psql
      - name: Contrôler propriétaire, conservation des pièces jointes et isolation
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -A -t -f - < audit/s10-local-post-phase-1-to-4-integrity-READ-ONLY.psql | tee /tmp/s10-local-synthetic-integrity.json
          grep -q 'LOCAL_SCHEMA_INTEGRITY_PASS' /tmp/s10-local-synthetic-integrity.json
          ! grep -q 'LOCAL_SCHEMA_INTEGRITY_FAIL' /tmp/s10-local-synthetic-integrity.json
      - name: Confirmer que clients, BT, factures et montants sont inchangés octet pour octet dans le JSON logique
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -Atc "SELECT md5(data::text) FROM public.garage_data;" > /tmp/s10-after-business-data.md5
          cmp /tmp/s10-before-business-data.md5 /tmp/s10-after-business-data.md5
      - name: Cloner les phases 1-4 sans toucher à la source puis continuer 5-10
        shell: bash
        run: |
          set -euo pipefail
          docker exec ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE atelier_jl_s10_continuation TEMPLATE atelier_jl_restore_test"
          # Reproduce the REAL office restore: only 3 owner policies survived pg_restore.
          # Synthetic source contains 0 policies; recreate precisely the 3 rules
          # observed on the office machine, while keeping the source DB untouched.
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_s10_continuation -f - < audit/s10-ci-three-legacy-policies.sql
          docker exec ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_s10_continuation -Atc "SELECT 1 / CASE WHEN (SELECT count(*) FROM pg_policies WHERE schemaname='public' AND tablename='garage_data')=3 THEN 1 ELSE 0 END"
          docker cp audit/s10-local-clone-supabase-shims.sql ${{ job.services.postgres.id }}:/tmp/s10-audit/s10-local-clone-supabase-shims.sql
          docker exec ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_s10_continuation -f /tmp/s10-audit/s10-local-clone-supabase-shims.sql
          node audit/s10-generate-local-phase5-to-10.cjs /tmp/s10-continuation.sql
          docker cp /tmp/s10-continuation.sql ${{ job.services.postgres.id }}:/tmp/s10-audit/s10-continuation.sql
          docker exec ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_s10_continuation -f /tmp/s10-audit/s10-continuation.sql
          src=$(docker exec ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -Atc "SELECT md5(data::text) FROM public.garage_data")
          dst=$(docker exec ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_s10_continuation -Atc "SELECT md5(data::text) FROM public.garage_data")
          test "$src" = "$dst"
          docker exec ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_s10_continuation -Atc "SELECT 1 / CASE WHEN (SELECT count(*) FROM public.garage_members WHERE role='owner')=1 AND (SELECT count(*) FROM storage.objects WHERE bucket_id='wo-files')=55 AND (SELECT count(*) FROM pg_policies WHERE schemaname='public' AND tablename='garage_data')=2 AND to_regprocedure('public.s06_timer_transition(uuid,text,bigint,text)') IS NOT NULL THEN 1 ELSE 0 END"
          echo S10_EXISTING_LOCAL_RESTORE_CONTINUATION_OK
      - name: Vérifier que la base SQL cible est bien locale et ne contient aucune donnée réelle
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -Atc "SELECT 1 / CASE WHEN current_database()='atelier_jl_restore_test' AND (SELECT count(*) FROM public.garage_data)=1 AND (SELECT count(*) FROM storage.objects)=55 THEN 1 ELSE 0 END;"

  full-candidate-sql-rehearsal:
    name: S10 SQL complet — PostgreSQL fictif / NO PROD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: s10_fake_ci_password_only
          POSTGRES_DB: atelier_jl_restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atelier_jl_restore_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: atelier_jl_restore_test
      PGPASSWORD: s10_fake_ci_password_only
    steps:
      - uses: actions/checkout@v4
      - name: Préparer exclusivement les données synthétiques et stubs Supabase
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -f - < audit/s10-ci-synthetic-prod-restore-fixture.sql
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -f - < audit/s10-ci-supabase-runtime-stubs.sql
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -Atc "SELECT md5(data::text) FROM public.garage_data" > /tmp/s10-full-before.md5
      - name: Vérifier la cible jetable et exécuter le candidat SQL complet
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -Atc "SELECT 1 / CASE WHEN current_database()='atelier_jl_restore_test' AND (SELECT count(*) FROM auth.users)=1 THEN 1 ELSE 0 END"
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -f - < audit/s10-prod-complete-migration-candidate-NOT-EXECUTED.sql
      - name: Vérifier l'isolation owner/employee/second garage et les droits
        run: docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -f - < audit/s10-ci-garage-data-rls-isolation.sql
      - name: Tester mutations autorisées et refusées avec ROLLBACK intégral
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -f - < audit/s10-ci-garage-write-rls-rollback.sql
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -Atc "SELECT 1 / CASE WHEN (SELECT count(*) FROM auth.users)=1 AND (SELECT count(*) FROM public.garage_data)=1 AND (SELECT count(*) FROM public.garage_quotes)=0 AND (SELECT count(*) FROM public.garage_members)=1 THEN 1 ELSE 0 END"
      - name: Tester refus des RPC minuterie et facture inter-garages sans persistance
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -f - < audit/s10-ci-timer-invoice-auth-rollback.sql
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -Atc "SELECT 1 / CASE WHEN (SELECT count(*) FROM auth.users)=1 AND (SELECT count(*) FROM public.garage_data)=1 AND (SELECT count(*) FROM public.garage_timer_sessions)=0 AND (SELECT count(*) FROM public.garage_members)=1 THEN 1 ELSE 0 END"
      - name: Migrer les anciennes politiques Storage sur bucket privé fictif
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -f - < audit/s10-ci-storage-legacy-fixture.sql
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -f - < audit/s10-storage-tenant-isolation-candidate-NOT-EXECUTED.sql
      - name: Vérifier accès Storage ancien/nouveau pour owner, employé, autre garage
        run: docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -f - < audit/s10-ci-storage-rls-isolation.sql
      - name: Simuler une bascule atomique bucket public vers prive avec RLS dans la meme transaction
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -f - < audit/s10-ci-storage-public-reset.sql
          node audit/s10-build-atomic-storage-cutover.cjs /tmp/s10-atomic-storage-NOT-EXECUTED.sql
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -f - < /tmp/s10-atomic-storage-NOT-EXECUTED.sql
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -f - < audit/s10-ci-storage-rls-isolation.sql
          echo S10_ATOMIC_STORAGE_PUBLIC_PRIVATE_RLS_OK
      - name: Vérifier la conservation des données et le schéma final
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -Atc "SELECT md5(data::text) FROM public.garage_data" > /tmp/s10-full-after.md5
          cmp /tmp/s10-full-before.md5 /tmp/s10-full-after.md5
          docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d atelier_jl_restore_test -Atc "SELECT 1 / CASE WHEN (SELECT count(*) FROM public.garage_data)=1 AND (SELECT count(*) FROM public.garages)=1 AND (SELECT count(*) FROM public.garage_members WHERE role='owner')=1 AND (SELECT count(*) FROM storage.objects WHERE bucket_id='wo-files')=55 AND (SELECT count(*) FROM public.garage_quotes)=0 AND to_regprocedure('public.s06_timer_transition(uuid,text,bigint,text)') IS NOT NULL AND to_regprocedure('public.s08_convert_quote_to_workorder(uuid,bigint,bigint,boolean)') IS NOT NULL THEN 1 ELSE 0 END;"
          echo S10_FULL_SQL_SYNTHETIC_VALIDATION_OK
