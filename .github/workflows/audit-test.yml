name: Audit statique TEST
on:
  push:
    branches:
      - "audit/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérification statique non destructive
        run: node audit/check-static.cjs
      - name: Scénarios de suppression simulés
        run: node audit/test-a01.cjs
      - name: Fusion concurrente des pièces jointes (simulée)
        run: node audit/test-attachments.cjs
