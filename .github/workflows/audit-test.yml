name: Audit statique TEST
on:
  push:
    branches:
      - "audit/**"
      - "s03/**"
      - "s04/**"
      - "s05/**"
      - "s06/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérification statique non destructive
        run: node audit/check-static.cjs
      - name: Scénarios de suppression simulés
        run: node audit/test-a01.cjs
      - name: Fusion concurrente des pièces jointes (simulée)
        run: node audit/test-attachments.cjs
      - name: Paiements partiels S03-F01 (simulés)
        run: node audit/test-s03-factures.cjs
      - name: Bons de travail S04 (simulés)
        run: node audit/test-s04-workorders.cjs

      - name: Recherches et tris S05 (simulés)
        run: node audit/test-s05-search.cjs
      - name: Minuterie S06-F01 (pure, simulée)
        run: node audit/test-s06-timer.cjs
      - name: Protections S06-F02 (statiques, migration non executee)
        run: node audit/test-s06-storage.cjs
      - name: Adaptateur S06-F03 (Supabase simule)
        run: node audit/test-s06-client.cjs
      - name: Panneau global S06-F04 (maquette isolee)
        run: node audit/test-s06-panel.cjs
      - name: Apercu global S06 integre TEST (lecture seule)
        run: node audit/test-s06-preview-integration.cjs
      - name: Validation BT S06 (simulations)
        run: node audit/test-s06-eligibility.cjs
      - name: Confirmation main oeuvre S06-F05 (simulations)
        run: node audit/test-s06-posting.cjs
      - name: Attribution employe S06 (simulations)
        run: node audit/test-s06-actor.cjs
      - name: Transaction atomique S06-F05 (simulation sans SQL)
        run: node audit/test-s06-atomic-draft.cjs
      - name: Proposition serveur S06 V2 (audit statique)
        run: node audit/test-s06-sql-v2.cjs
