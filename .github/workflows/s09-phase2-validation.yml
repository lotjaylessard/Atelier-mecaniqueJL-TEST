name: S09 Horaire phase 2 validation TEST
on:
  push:
    branches:
      - feature/notes-bt-historique
    paths:
      - 'index.html'
      - 'tests/s09-*.test.cjs'
      - '.github/workflows/s09-phase2-validation.yml'
  workflow_dispatch:
jobs:
  s09-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all S09 regression tests
        run: node --test tests/s09-*.test.cjs
      - name: Complete offline regression suite (other modules)
        run: node --test tests/*.test.cjs
      - name: Real Chromium monthly calendar smoke (offline fixtures)
        run: node tests/s09-horaire-chromium.cjs
      - name: Validate HTML inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),cp=require('child_process');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)].filter(m=>m[2].trim());
          for(const [i,entry] of scripts.entries()){
            const code=entry[2],isModule=/\btype\s*=\s*["']module["']/i.test(entry[1]);
            if(isModule){
              const check=cp.spawnSync(process.execPath,['--check','--input-type=module'],{input:code,encoding:'utf8'});
              if(check.status!==0)throw Error('Module '+i+' syntax: '+check.stderr);
            }else new vm.Script(code,{filename:'inline-'+i+'.js'});
          }
          console.log('Validated',scripts.length,'inline scripts, including ES modules');
          NODE
