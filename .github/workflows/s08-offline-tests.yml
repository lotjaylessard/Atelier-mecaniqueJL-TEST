name: S08 - tests locaux sans cloud
on:
  push:
    branches:
      - s08/soumissions
    paths:
      - 'tests/**'
      - 'index.html'
      - 'login.html'
      - 'start-s08-preview.py'
      - 'Demarrer-S08-TEST-Windows.bat'
      - 'LISEZ-MOI-S08-TEST.txt'
      - '.github/workflows/s08-offline-tests.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute real offline Chromium smoke
        id: chromium_smoke
        shell: bash
        run: |
          set +e
          node tests/s08-chromium-offline.cjs > "$RUNNER_TEMP/s08-chromium.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/s08-chromium.log"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Execute real offline Chromium login smoke
        id: chromium_login
        shell: bash
        run: |
          set +e
          node tests/s08-login-chromium-offline.cjs > "$RUNNER_TEMP/s08-chromium-login.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/s08-chromium-login.log"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Execute offline tests and capture verdict
        id: node_tests
        if: always()
        shell: bash
        run: |
          set +e
          node --test tests/*.test.cjs > "$RUNNER_TEMP/s08-node-tests.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/s08-node-tests.log"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          S08_TEST_EXIT_CODE="$code" S08_CHROMIUM_EXIT_CODE="${{ steps.chromium_smoke.outputs.exit_code }}" S08_LOGIN_CHROMIUM_EXIT_CODE="${{ steps.chromium_login.outputs.exit_code }}" node - <<'NODE'
          const fs = require('node:fs');
          const log = fs.readFileSync(process.env.RUNNER_TEMP + '/s08-node-tests.log', 'utf8');
          const count = key => Number((log.match(new RegExp('^# ' + key + ' (\\d+)$', 'm')) || [])[1] || 0);
          const exitCode = Number(process.env.S08_TEST_EXIT_CODE);
          const browserExitCode = Number(process.env.S08_CHROMIUM_EXIT_CODE);
          const loginBrowserExitCode = Number(process.env.S08_LOGIN_CHROMIUM_EXIT_CODE);
          const report = {
            source_commit: process.env.GITHUB_SHA,
            workflow_run_id: process.env.GITHUB_RUN_ID,
            workflow_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            node_version: process.version,
            result: exitCode === 0 && browserExitCode === 0 && loginBrowserExitCode === 0 ? 'PASS' : 'FAIL',
            exit_code: exitCode,
            chromium_offline_exit_code: browserExitCode,
            chromium_offline_result: browserExitCode === 0 ? 'PASS' : 'FAIL',
            chromium_login_exit_code: loginBrowserExitCode,
            chromium_login_result: loginBrowserExitCode === 0 ? 'PASS' : 'FAIL',
            tests: count('tests'),
            passed: count('pass'),
            failed: count('fail'),
            scope: 'offline Node tests and real Chromium with fake data; NO authenticated Chrome and NO physical Storage restore'
          };
          fs.mkdirSync('audit', { recursive: true });
          fs.writeFileSync('audit/s08-ci-latest.json', JSON.stringify(report, null, 2) + '\n');
          NODE
      - name: Package isolated S08 browser preview (no deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-s08-preview-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            index.html
            login.html
            start-s08-preview.py
            Demarrer-S08-TEST-Windows.bat
            LISEZ-MOI-S08-TEST.txt
            audit/s06-live-test.js
            audit/s06-wo-pilot.js
            audit/s06-sidebar-persistent.js
            audit/s08-physical-backup.html
            audit/s08-physical-backup.js
      - name: Probe public GitHub Pages deployment parity
        if: always()
        shell: bash
        run: |
          node tests/s08-pages-deployment-probe.cjs
      - name: Publish test attestation on TEST branch
        if: always()
        shell: bash
        run: |
          if [ ! -f audit/s08-ci-latest.json ]; then
            echo 'Test attestation was not created'
            exit 1
          fi
          node -e 'const fs=require("fs"); const a=JSON.parse(fs.readFileSync("audit/s08-ci-latest.json","utf8")); if(a.source_commit!==process.env.GITHUB_SHA) process.exit(1)'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/s08-ci-latest.json audit/s08-pages-deployment.json
          if git diff --cached --quiet; then
            echo 'No attestation changes to commit'
          else
            git commit -m "S08 CI: record offline Node test verdict [skip ci]"
            git push origin HEAD:refs/heads/s08/soumissions
          fi
      - name: Fail workflow on Node or Chromium regression
        if: ${{ steps.node_tests.outputs.exit_code != '0' || steps.chromium_smoke.outputs.exit_code != '0' || steps.chromium_login.outputs.exit_code != '0' }}
        run: exit 1
