name: S08 - tests locaux sans cloud
on:
  push:
    branches:
      - s08/soumissions
    paths:
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/s08-offline-tests.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify offline garage audit tests
        run: |
          node --test tests/*.test.cjs
