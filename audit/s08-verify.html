<!doctype html>
<html lang="fr-CA">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier JL TEST — Vérifier une sauvegarde</title>
<style>
body{font:16px system-ui,sans-serif;max-width:720px;margin:3rem auto;padding:0 1rem;background:#101827;color:#f1f5f9}
button{background:#2563eb;color:white;border:0;border-radius:8px;padding:12px 16px;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1e293b;padding:1rem;border-radius:8px}
small{color:#cbd5e1}
</style></head><body>
<h1>Vérification locale d'une sauvegarde TEST</h1>
<p>Choisir le dossier <code>garage-s08-physical-…</code> déjà créé sur votre ordinateur. Aucun fichier n'est envoyé au serveur.</p>
<p><button id="choose" type="button">Choisir et vérifier le dossier</button></p>
<p id="status" role="status" aria-live="polite">En attente du dossier.</p>
<pre id="report" aria-label="Résultats de la vérification"></pre>
<small>Cette page contrôle l'intégrité des fichiers et du manifeste. Elle ne restaure pas la base de données.</small>
<script src="./s08-verify-physical-backup.js"></script>
<script>
"use strict";
const button=document.getElementById("choose"),status=document.getElementById("status"),report=document.getElementById("report");
if(typeof window.showDirectoryPicker!=="function"||!window.crypto?.subtle){
 button.disabled=true;status.textContent="Utiliser Chrome ou Edge sur ordinateur, via HTTPS, pour sélectionner un dossier.";
}
button.addEventListener("click",async()=>{
 button.disabled=true;report.textContent="";
 try{
  const folder=await window.showDirectoryPicker({mode:"read"});
  const result=await window.S08BackupVerifier.verify(folder,message=>status.textContent=message);
  status.textContent=result.ok?"Vérification réussie":"Vérification échouée";
  report.textContent=JSON.stringify(result,null,2);
 }catch(error){
  status.textContent="Vérification interrompue";
  report.textContent=String(error?.message||error);
 }finally{button.disabled=false}
});
</script></body></html>
